<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PlaceMate | Login</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        :root {
            --lime: #C6F36B;
            --white: #ffffff;
            --green: #183D32;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;

            background: linear-gradient(
                135deg,
                #102D25,
                #183D32,
                #315D45,
                #172F28
            );

            background-size: 300% 300%;
            animation: backgroundMove 12s ease infinite;
        }

        @keyframes backgroundMove {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        .circle {
            position: absolute;
            border-radius: 50%;
            filter: blur(1px);
            animation: float 8s ease-in-out infinite;
        }

        .circle-one {
            width: 220px;
            height: 220px;
            background: rgba(198, 243, 107, 0.18);
            top: 8%;
            left: 12%;
        }

        .circle-two {
            width: 160px;
            height: 160px;
            background: rgba(255, 255, 255, 0.12);
            bottom: 10%;
            right: 15%;
            animation-delay: 2s;
        }

        .circle-three {
            width: 100px;
            height: 100px;
            background: rgba(198, 243, 107, 0.20);
            bottom: 20%;
            left: 25%;
            animation-delay: 4s;
        }

        .circle-four {
            width: 130px;
            height: 130px;
            background: rgba(255, 255, 255, 0.10);
            top: 15%;
            right: 22%;
            animation-delay: 1s;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0) translateX(0);
            }

            50% {
                transform: translateY(-25px) translateX(15px);
            }
        }

        .container {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 430px;
            padding: 20px;
        }

        .login-card {
            width: 100%;
            padding: 38px 38px 30px;

            background: rgba(255, 255, 255, 0.10);

            border: 1px solid rgba(255, 255, 255, 0.28);

            border-radius: 22px;

            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);

            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.20);

            animation: cardAppear 0.8s ease;
        }

        @keyframes cardAppear {
            from {
                opacity: 0;
                transform: translateY(25px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .brand {
            text-align: center;
            margin-bottom: 28px;
        }

        .brand-icon {
            width: 52px;
            height: 52px;

            margin: 0 auto 12px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: var(--lime);
            color: var(--green);

            border-radius: 15px;

            font-size: 25px;
        }

        .brand h2 {
            color: var(--white);
            font-size: 25px;
            font-weight: 800;
            letter-spacing: -1px;
        }

        .brand h2 span {
            color: var(--lime);
        }

        .brand p {
            color: rgba(255, 255, 255, 0.72);
            font-size: 11px;
            margin-top: 5px;
        }

        .form-heading {
            text-align: center;
            margin-bottom: 25px;
        }

        .form-heading h1 {
            color: var(--white);
            font-size: 27px;
            font-weight: 600;
        }

        .form-heading p {
            color: rgba(255, 255, 255, 0.68);
            font-size: 11px;
            margin-top: 5px;
        }

        .inputbox {
            position: relative;
            margin-bottom: 23px;
        }

        .inputbox label {
            display: block;
            color: var(--white);
            font-size: 11px;
            font-weight: 500;
            margin-bottom: 8px;
        }

        .inputbox input {
            width: 100%;
            height: 49px;

            padding: 0 42px 0 15px;

            color: var(--white);
            font-size: 12px;

            background: rgba(255, 255, 255, 0.10);

            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 10px;

            outline: none;

            transition: 0.3s;
        }

        .inputbox input::placeholder {
            color: rgba(255, 255, 255, 0.55);
        }

        .inputbox input:focus {
            border-color: var(--lime);
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 0 0 12px rgba(198, 243, 107, 0.12);
        }

        .inputbox > i {
            position: absolute;
            right: 15px;
            bottom: 15px;

            color: var(--lime);
            font-size: 16px;
        }

        .password-input {
            position: relative;
        }

        .password-input input {
            padding-right: 70px;
        }

        .toggle-password {
            position: absolute;
            right: 13px;
            top: 16px;

            border: none;
            background: transparent;

            color: var(--lime);
            font-size: 9px;
            font-weight: 600;

            cursor: pointer;
        }

        .remember {
            display: flex;
            justify-content: space-between;
            align-items: center;

            margin: 4px 0 24px;

            color: rgba(255, 255, 255, 0.85);
            font-size: 10px;
        }

        .remember label {
            display: flex;
            align-items: center;
            gap: 7px;
            cursor: pointer;
        }

        .remember input {
            accent-color: var(--lime);
            cursor: pointer;
        }

        .remember a {
            color: var(--lime);
            text-decoration: none;
        }

        .remember a:hover {
            text-decoration: underline;
        }

        .login-btn {
            width: 100%;
            height: 49px;

            border: none;
            border-radius: 10px;

            background: var(--lime);
            color: var(--green);

            font-size: 12px;
            font-weight: 700;

            cursor: pointer;

            transition: 0.3s;
        }

        .login-btn i {
            margin-left: 7px;
        }

        .login-btn:hover {
            background: white;
            transform: translateY(-3px);
            box-shadow: 0 8px 22px rgba(0, 0, 0, 0.15);
        }

        .login-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .register {
            text-align: center;
            margin-top: 23px;

            color: rgba(255, 255, 255, 0.75);
            font-size: 10px;
        }

        .register a {
            color: var(--lime);
            font-weight: 600;
            text-decoration: none;
            margin-left: 3px;
        }

        .register a:hover {
            text-decoration: underline;
        }

        .footer {
            text-align: center;
            margin-top: 25px;

            color: rgba(255, 255, 255, 0.48);
            font-size: 9px;
            letter-spacing: 1px;
        }

        @media(max-width: 480px) {

            .container {
                max-width: 390px;
            }

            .login-card {
                padding: 30px 23px 25px;
            }

            .brand h2 {
                font-size: 23px;
            }

            .form-heading h1 {
                font-size: 24px;
            }

            .circle-one {
                width: 130px;
                height: 130px;
            }

            .circle-two {
                width: 110px;
                height: 110px;
            }
        }

        @media(prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

    </style>

</head>

<body>

<div class="circle circle-one"></div>
<div class="circle circle-two"></div>
<div class="circle circle-three"></div>
<div class="circle circle-four"></div>

<div class="container">

    <div class="login-card">

        <div class="brand">

            <div class="brand-icon">
                <i class="bi bi-mortarboard-fill"></i>
            </div>

            <h2>Place<span>Mate</span></h2>

            <p>Smart Placement Management System</p>

        </div>

        <div class="form-heading">

            <h1>Welcome Back!</h1>

            <p>Login to continue your placement journey.</p>

        </div>

        <form id="loginForm">

            <div class="inputbox">

                <label for="email">Email Address</label>

                <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                >

                <i class="bi bi-envelope"></i>

            </div>

            <div class="inputbox">

                <label for="password">Password</label>

                <div class="password-input">

                    <input
                            type="password"
                            id="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                    >

                    <button
                            type="button"
                            class="toggle-password"
                            id="togglePassword">
                        SHOW
                    </button>

                </div>

            </div>

            <div class="remember">

                <label>
                    <input type="checkbox" id="rememberMe">
                    Remember Me
                </label>

                <a href="#" id="forgotPassword">Forgot Password?</a>

            </div>

            <button type="submit" class="login-btn" id="loginButton">

                Login to Account
                <i class="bi bi-arrow-right"></i>

            </button>

        </form>

        <div class="register">

            Don't have an account?

            <a href="/register.html">Create Account</a>

        </div>

    </div>

    <div class="footer">

        © 2026 PLACEMATE. ALL RIGHTS RESERVED.

    </div>

</div>

<script>

    // SHOW / HIDE PASSWORD

    const password = document.getElementById("password");

    const togglePassword = document.getElementById("togglePassword");

    togglePassword.addEventListener("click", function () {

        if (password.type === "password") {

            password.type = "text";
            togglePassword.textContent = "HIDE";

        } else {

            password.type = "password";
            togglePassword.textContent = "SHOW";

        }

    });


    // LOGIN FORM - BACKEND API INTEGRATION

    document.getElementById("loginForm").addEventListener("submit", async function (event) {

        event.preventDefault();

        const email = document.getElementById("email").value.trim();
        const passwordValue = password.value;
        const rememberMe = document.getElementById("rememberMe").checked;

        const loginButton = document.getElementById("loginButton");

        try {

            loginButton.disabled = true;
            loginButton.innerHTML = "Logging In...";

            const response = await fetch("/api/auth/login", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({

                    email: email,
                    password: passwordValue

                })

            });

            const responseText = await response.text();

            let data = {};

            try {

                data = responseText ? JSON.parse(responseText) : {};

            } catch (error) {

                data = {};

            }

            if (!response.ok) {

                alert(
                    data.message ||
                    data.detail ||
                    data.error ||
                    "Invalid email or password. Please try again."
                );

                return;

            }

            if (!data.token) {

                alert("Login response received, but authentication token is missing.");

                return;

            }

            const role = (data.role || "").toUpperCase();

            // Role-based dashboard routes
            const dashboardRoutes = {
                STUDENT: "/student-dashboard.html",
                ROLE_STUDENT: "/student-dashboard.html",
                RECRUITER: "/recruiter-dashboard.html",
                ROLE_RECRUITER: "/recruiter-dashboard.html",
                ADMIN: "/admin-dashboard.html",
                ROLE_ADMIN: "/admin-dashboard.html"
            };

            const dashboardUrl = dashboardRoutes[role];

            if (!dashboardUrl) {
                alert("Unknown user role: " + (data.role || "Not provided"));
                return;
            }

            // Clear old authentication data
            const authKeys = ["token", "userId", "userRole", "userEmail"];

            authKeys.forEach(key => {
                localStorage.removeItem(key);
                sessionStorage.removeItem(key);
            });

            // Save authentication details in selected storage
            const storage = rememberMe ? localStorage : sessionStorage;

            storage.setItem("token", data.token);
            storage.setItem("userId", data.userId);
            storage.setItem("userRole", role);
            storage.setItem("userEmail", data.email || email);

            console.log("Login successful");
            console.log("Logged-in User:", data.email || email);
            console.log("User Role:", role);

            alert(data.message || "Login successful!");
            window.location.replace(dashboardUrl);

        } catch (error) {

            console.error("Login Error:", error);

            alert("Unable to connect to server. Please check whether Spring Boot is running.");

        } finally {

            loginButton.disabled = false;

            loginButton.innerHTML =
                'Login to Account <i class="bi bi-arrow-right"></i>';

        }

    });


    // FORGOT PASSWORD - NOT IMPLEMENTED YET

    document.getElementById("forgotPassword").addEventListener("click", function (event) {

        event.preventDefault();

        alert("Forgot password functionality is not available yet.");

    });

</script>

</body>

</html>
