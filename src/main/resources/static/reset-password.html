<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PlaceMate | Reset Password</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
          rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #071f18, #103d2d, #071f18);
            padding: 20px;
            color: white;
        }

        .card {
            width: 100%;
            max-width: 420px;
            padding: 40px 32px;
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 20px;
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(15px);
            box-shadow: 0 15px 45px rgba(0,0,0,0.3);
        }

        .logo {
            text-align: center;
            color: #b7f34a;
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 25px;
        }

        h2 {
            text-align: center;
            font-size: 23px;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #c2d5cc;
            font-size: 13px;
            margin-bottom: 28px;
        }

        label {
            display: block;
            font-size: 13px;
            margin-bottom: 8px;
            color: #e2eee7;
        }

        input {
            width: 100%;
            padding: 13px 14px;
            margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 10px;
            outline: none;
            background: rgba(255,255,255,0.08);
            color: white;
            font-size: 14px;
        }

        input:focus {
            border-color: #b7f34a;
        }

        input::placeholder {
            color: #aabdb2;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 10px;
            background: #b7f34a;
            color: #102719;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 22px;
            color: #b7f34a;
            text-decoration: none;
            font-size: 13px;
        }

        #toast {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 20px;
            border-radius: 9px;
            background: #183e2e;
            color: white;
            font-size: 13px;
            display: none;
            text-align: center;
            max-width: 90%;
        }
    </style>
</head>

<body>

<div class="card">

    <div class="logo">PlaceMate</div>

    <h2>Reset Password</h2>

    <p class="subtitle">
        Create a new password for your account.
    </p>

    <form id="resetForm">

        <label for="newPassword">New Password</label>
        <input
                type="password"
                id="newPassword"
                placeholder="Enter new password"
                minlength="8"
                required
        >

        <label for="confirmPassword">Confirm Password</label>
        <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm new password"
                minlength="8"
                required
        >

        <button type="submit" id="resetButton">
            Reset Password
        </button>

    </form>

    <a href="/index.html" class="back">Back to Login</a>

</div>

<div id="toast"></div>

<script>

    const token = new URLSearchParams(window.location.search).get("token");

    const form = document.getElementById("resetForm");
    const button = document.getElementById("resetButton");
    const toast = document.getElementById("toast");

    function showToast(message) {
        toast.textContent = message;
        toast.style.display = "block";

        setTimeout(() => {
            toast.style.display = "none";
        }, 4000);
    }

    if (!token) {
        form.querySelectorAll("input, button").forEach(element => {
            element.disabled = true;
        });

        showToast("Invalid or missing reset link.");
    }

    form.addEventListener("submit", async function (event) {

        event.preventDefault();

        if (!token) {
            showToast("Invalid reset link.");
            return;
        }

        const newPassword = document.getElementById("newPassword").value;
        const confirmPassword = document.getElementById("confirmPassword").value;

        if (newPassword.length < 8) {
            showToast("Password must contain at least 8 characters.");
            return;
        }

        if (newPassword !== confirmPassword) {
            showToast("Passwords do not match.");
            return;
        }

        button.disabled = true;
        button.textContent = "Resetting...";

        try {

            const response = await fetch("/api/auth/reset-password", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    token: token,
                    newPassword: newPassword
                })

            });

            const data = await response.json();

            if (!response.ok) {
                showToast(data.message || "Unable to reset password.");
                button.disabled = false;
                button.textContent = "Reset Password";
                return;
            }

            showToast("Password reset successfully!");

            setTimeout(() => {
                window.location.href = "/index.html";
            }, 1800);

        } catch (error) {

            showToast("Unable to connect to server.");
            button.disabled = false;
            button.textContent = "Reset Password";

        }

    });

</script>

</body>
</html>
